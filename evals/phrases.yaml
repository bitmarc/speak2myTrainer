  context: "Interview question: Tell me about an important project or challenge that you are proud of."
  text: "The principal challenge was to make the agent follow the strict rules or flow of the business in the conversation. I think this is one of the most common challenges in AI projects. So we solved it via combining orchestration with prompt engineering."
