  text: "One important thing is that this system needs to have a respect role access control. So the front-end was developed on FastAPI and the back-end was developed on Python with FastAPI. Sorry, front-end with Angular, okay? So what was my role?"
  verbatim: "one important thing is that this system needs to and kaba respect role access control so the front end was developed on fast API and the back end was developed on on python with fastapi sorry front end with angular OK so what what was my role"
