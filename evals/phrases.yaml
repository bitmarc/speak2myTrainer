# Set de evaluación: frases ambiguas etiquetadas a mano.
#
# split          dev (por defecto): sirve para ajustar el prompt. test: fragmentos reales que
#                nunca se usan para ajustarlo; detectan sobreajuste.
# text           texto de registro (gpt-4o-mini-transcribe).
# verbatim       forma léxica de Speech; si falta, se usa `text` (ADR 0002).
# fillers        tokens que SÍ son muletillas (uno por ocurrencia), en minúsculas.
# allow_fillers  tokens que se pueden marcar o no sin penalizar (p. ej., reinicios dudosos).
# errors         fragmentos que SÍ son error gramatical (severity = error).
# allow_errors   fragmentos que pueden salir como error sin contar como falso positivo.
#
# Métrica (PRD): 0 falsos positivos en muletillas y en Error, recall ≥ 90%.
# Lo que no está en `errors` puede salir como suggestion o style sin penalizar.

- id: like-verb
  text: "I like coffee in the morning, and I really like working early."
  fillers: []
  errors: []

- id: like-filler
  text: "The project was, like, huge, and the deadline was really short."
  fillers: [like]
  errors: []

- id: like-conjunction
  text: "Like I said, the API was slow because we didn't cache anything."
  fillers: []
  errors: []

- id: like-quotative
  text: "When the build failed again I was like, why is this happening?"
  fillers: []
  errors: []

- id: so-connector
  text: "So the client needed to manage users and roles in the platform."
  fillers: []
  errors: []

- id: so-restart
  text: "So, so, the idea was to cache the embeddings before the search."
  fillers: [so]
  allow_fillers: [so]
  errors: []

- id: well-opener
  text: "Well, I once worked on a project for a bank in Mexico."
  fillers: []
  errors: []

- id: hesitations
  text: "Um, I think the main challenge was, uh, the deadline."
  fillers: [um, uh]
  errors: []

- id: hmm-thinking
  text: "Hmm, let me think. The biggest lesson was about testing early."
  fillers: [hmm]
  errors: []

- id: restart-we
  text: "We, um, we migrated the, the whole system to Kubernetes last year."
  fillers: [um]
  allow_fillers: [we, the, "we, um, we", "the, the"]
  errors: []

- id: you-know-literal
  text: "Do you know the answer? I'm not sure if you know it."
  fillers: []
  errors: []

- id: you-know-filler
  text: "It was, you know, really hard to scale the database."
  fillers: [you know]
  errors: []

- id: actually-corrective
  text: "Actually, the real problem was the cache, not the database."
  fillers: []
  errors: []

- id: gonna-wanna
  text: "We're gonna deploy it next week, but I wanna test it first."
  fillers: []
  errors: []

- id: prd-example
  text: "I once participated on a project where we build a system based on a RAG architecture."
  fillers: []
  errors: ["participated on", "we build"]

- id: avoid-to
  text: "The client wanted to avoid some employees to ask questions about salaries."
  fillers: []
  errors: ["avoid some employees to ask"]

- id: since-years
  text: "I have worked as a backend developer since three years."
  fillers: []
  errors: ["since three years"]

- id: explained-me
  text: "My manager explained me the architecture on my first day."
  fillers: []
  errors: ["explained me"]

- id: im-agree
  text: "I'm agree with that approach, it makes the code easier to test."
  fillers: []
  errors: ["i'm agree"]

- id: she-dont
  text: "She don't have experience with Docker, so I helped her."
  fillers: []
  errors: ["she don't"]

- id: doubts-false-friend
  text: "The employees had many doubts about how to use the new system."
  fillers: []
  errors: []

- id: me-and-my-team
  text: "Me and my team built the pipeline in two weeks. There's a lot of reasons why it worked."
  fillers: []
  errors: []

# --- Set de prueba: fragmentos reales (split: test) ---------------------------------------
# Respuestas reales de Marco a preguntas de entrevista (spikes de la Fase 0), sin nombres ni
# empresas. `text` es gpt-4o-mini-transcribe y `verbatim` la forma léxica de Speech, tal cual.
# Etiquetas propuestas por Claude y revisadas por Marco. NO se usan para ajustar el prompt.
# Las hesitaciones (um, uh, hmm) se esperan con la grafía de Speech: las cuenta Python.

- id: real-sectors
  split: test
  context: "Interview question: Tell me about yourself."
  text: "I have over five years of experience working on software development, and I have experience in different projects from different sectors, such as telecommunications, financial, sales, and educational. I think this has given me a broad perspective of how is build solutions for different business contexts."
  verbatim: "i have over five years of experience working on software development and um i have experience in different projects from different sectors um such as telecommunications financial sales and educational i think uh this half has given me a broad perspective of how is build solutions for different business contexts"
  fillers: [um, um, uh]
  allow_fillers: [half, this, this half]
  errors: ["how is build"]

- id: real-like-learn
  split: test
  context: "Interview question: Tell me about yourself."
  text: "I consider I am a reliable person. I like learn and teach others. And in the last years, I've been moving into AI-powered software solutions because I think the AI is the future of the development, and I think I could give a really high value on that."
  verbatim: "umm i consider i am a reliable person i like learn and teach others and in the last years i've been moving into AI powered software solutions because i think the AI is the future of the development and i think i could give a really high value on that"
  fillers: [umm]
  errors: ["like learn"]
  allow_errors: ["i consider i am", "in the last years", "the ai is the future of the development", "give a really high value on that"]

- id: real-mcp-tried
  split: test
  context: "Interview question: Have you worked with MCPs (Model Context Protocol)?"
  text: "In a professional way, I don't work with MCPs, or Model Context Protocol, yet, but I know the control, and I have tried it with a personal project to know how it works"
  verbatim: "in a professional way i don't work with MCPS or model contacts protocol jet but i know the control and i i have hmm try it with a personal project and to know how it works"
  fillers: [hmm, i]
  allow_fillers: [and]
  errors: []
  allow_errors: ["in a professional way", "i don't work with mcps", "i know the control", "to know how it works"]

- id: real-mcp-standard
  split: test
  context: "Interview question: Have you worked with MCPs (Model Context Protocol)?"
  text: "I think it's a very relevant standard that solves a real problem that was that each integration of agents with tools was in a custom form, but now this is a standard to make more easy the reuse of different tools with different models and providers."
  verbatim: "i think it's a very relevant standard that solves a real problem that uh that was that each integration of agents with tools was in a custom form but now this it's an standard to to make more easy the reuse umm different tools with different models and providers"
  fillers: [uh, umm, that, to]
  allow_fillers: [this, "it's"]
  errors: ["make more easy"]
  allow_errors: ["a real problem that was that", "in a custom form"]

- id: real-feedback-once
  split: test
  context: "Interview question: Describe a time you received constructive feedback. What did you do with it?"
  text: "Once, I once received a constructive feedback after a feature I developed caused a delay during a production window, or production maintenance window."
  verbatim: "once i once received a constructive feedback after um after a feature i developed caused a delay during a production window or production maintains window"
  fillers: [once, um, after]
  allow_fillers: [window, production, production window]
  errors: ["a constructive feedback"]
  allow_errors: ["production maintenance window"]

- id: real-feedback-manager
  split: test
  context: "Interview question: Describe a time you received constructive feedback. What did you do with it?"
  text: "So, my manager pointed out that passing test isn't enough. I also need to consider production workloads, scalability, and resource limitations. If I don't know the constraints of the production environment, I should ask before finalizing my implementation. And you know, I appreciate that feedback because it made me realize I had focused too much on making the feature work and not enough on how it would perform under the real conditions."
  verbatim: "um so my manager pointed out that passing tests isn't enough and i also need to consider production workloads scalability and resource limitations and if i don't know the constraint constraints of the production environment i should ask before finalizing my implementation and and you know i appreciate that feedback because i it made me realize i had focused too much on making the feature work and not enough on how it would perform under the real conditions"
  fillers: [um, constraint, and, you know, i]
  allow_fillers: [so]
  errors: []
  allow_errors: ["passing test isn't enough", "under the real conditions"]

- id: real-injection-first
  split: test
  context: "Interview question: How would you prevent prompt injection?"
  text: "So the first thing is to, like, make the instructions of the system take it a part of the data or context. The second thing is make a hardening of the system prompt, implement few-shot prompting or examples to show how the prompt injection could be."
  verbatim: "so the first thing is to and like make the instructions of the system take it apart of the they are our context the second thing is make a hardening of the system prompt implement few shot prompting or or examples to show how how the prompt injection could be"
  fillers: [like, or, how]
  allow_fillers: [and]
  errors: []
  allow_errors: ["take it a part of the data", "the second thing is make", "make a hardening", "how the prompt injection could be"]

- id: real-injection-third
  split: test
  context: "Interview question: How would you prevent prompt injection?"
  text: "The third thing is validate arguments of tools. And the fourth thing is apply the last privilege to make the agent use the minimum privileges in tools."
  verbatim: "the third thing is valid validates arguments of tools the fourth thing is supply the last privilege to make the agent use the minimum privileges in tools"
  fillers: [valid]
  errors: []
  allow_errors: ["the third thing is validate", "the fourth thing is apply", "the last privilege", "minimum privileges in tools"]

