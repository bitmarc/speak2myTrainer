[project]
name = "speak2mytrainer"
version = "0.1.0"
description = "Entrenador de voz para practicar inglés hablado: métricas de fluidez, muletillas, gramática y pronunciación."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Marco Rojas" }]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.19",
  "openai>=1.60",
  "azure-cognitiveservices-speech>=1.46",
  "azure-cosmos>=4.9",
  "azure-storage-blob>=12.24",
  "azure-storage-queue>=12.12",
]
web = [
  "streamlit>=1.45",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speak2mytrainer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["speak2mytrainer.domain.*", "speak2mytrainer.application.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "speak2mytrainer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas hexagonales"
type = "layers"
layers = [
  "speak2mytrainer.bootstrap",
  "speak2mytrainer.adapters",
  "speak2mytrainer.application",
  "speak2mytrainer.domain",
]

[[tool.importlinter.contracts]]
name = "El núcleo no conoce SDKs de Azure ni UI"
type = "forbidden"
source_modules = ["speak2mytrainer.domain", "speak2mytrainer.application"]
forbidden_modules = ["azure", "openai", "streamlit"]
